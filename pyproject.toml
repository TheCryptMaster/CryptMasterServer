[project]
name = "cryptmasterserver"
version = "2.0.0"
description = "Crypt Master Server -- a self-hosted secrets vault"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",  # sync driver, used only by the migration tool and alembic offline mode
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "password-strength>=0.0.3.post2",
    "redis>=5.0",
    "fastapi-limiter==0.1.6",  # 0.2.x is an incompatible rewrite (no FastAPILimiter/RateLimiter as used here)
    "pycryptodome>=3.20",  # only used by migration/legacy_crypto.py to read v1 data
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
